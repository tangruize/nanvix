[package]
name = "bitmap"
version.workspace = true
license-file.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
raw-array = { workspace = true }
sys = { workspace = true }
error = { workspace = true }
verus_stub = { workspace = true }
# Verus core libs needed for cargo-v to detect this crate as a verus target.
verus_builtin = { workspace = true, optional = true }
vstd = { workspace = true, optional = true }

[dev-dependencies]
rand = "0.8"

[features]
default = []
std = ["sys/std", "raw-array/std", "error/std"]
# Enable Verus verification for this crate.
verus = ["verus_stub/disable", "sys/verus", "raw-array/verus", "error/verus", "verus_builtin", "vstd"]

[lints]
workspace = true
